name: whisper_websocket_client_dart
description: WebSocket client for Whisper messaging server.
version: 0.3.0
repository: https://github.com/jsfraz/whisper_websocket_client_dart

environment:
  sdk: ^3.6.0

dependencies:
  web_socket_channel: ^3.0.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  dotenv: ^4.2.0
  pointycastle: ^4.0.0
  basic_utils: ^5.7.0
  dart_jsonwebtoken: ^3.2.0
  whisper_openapi_client_dart:
    git:
      url: https://github.com/jsfraz/whisper_openapi_client_dart.git
      # Pinned to the released client instead of a moving branch: the app and
      # this package must agree on the contract.
      ref: v0.1.0

# The live tests use the monorepo client, not the published tag.
dependency_overrides:
  whisper_openapi_client_dart:
    path: ../whisper_openapi_client_dart
